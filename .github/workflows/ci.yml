name: CI
# UNIQUE CODE IDENTIFIER: RP-DEASI-JUP-2026-0619-001
# Author: Richard Patterson (@De-ASI-INTERFACE)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build all packages
        run: npm run build
      - name: Verify SDK build output exists
        run: test -f packages/sdk/dist/identity.js || (echo '::error::SDK build output missing at packages/sdk/dist/identity.js' && exit 1)
      - name: Verify UID at runtime
        run: |
          node -e "
            const { UID } = require('./packages/sdk/dist/identity');
            if (UID !== 'RP-DEASI-JUP-2026-0619-001') { console.error('UID MISMATCH:', UID); process.exit(1); }
            console.log('UID verified:', UID);
          "
      - name: Run tests
        run: npm run test --workspaces --if-present
      - name: Secret scan (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
